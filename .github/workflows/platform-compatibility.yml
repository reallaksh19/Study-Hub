name: Platform compatibility matrix

on:
  workflow_dispatch:
    inputs:
      kani_sha:
        description: Exact Kani Game App commit SHA
        required: true
        type: string
      require_three_repo:
        description: Require resolved Worksheet repo/commit
        required: true
        default: false
        type: boolean
      worksheet_repo:
        description: Authoritative Worksheet repo (owner/name); leave blank while #13 is unresolved
        required: false
        type: string
      worksheet_sha:
        description: Exact Worksheet commit SHA
        required: false
        type: string

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Validate exact-SHA inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.kani_sha }}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "kani_sha must be a 40-character commit SHA"; exit 1; }
          if [[ -n "${{ inputs.worksheet_repo }}" || -n "${{ inputs.worksheet_sha }}" ]]; then
            [[ -n "${{ inputs.worksheet_repo }}" && "${{ inputs.worksheet_sha }}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Worksheet repo and exact SHA must be supplied together"; exit 1; }
          elif [[ "${{ inputs.require_three_repo }}" == "true" ]]; then
            echo "Three-repo compatibility is blocked until #13 records the authoritative Worksheet repo and an exact commit SHA."
            exit 1
          fi

      - name: Checkout Study-Hub authority at workflow commit
        uses: actions/checkout@v4
        with:
          path: study-hub

      - name: Checkout Kani at exact SHA
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Kani-Game-App
          ref: ${{ inputs.kani_sha }}
          path: kani

      - name: Checkout Worksheet at exact SHA when resolved
        if: ${{ inputs.worksheet_repo != '' && inputs.worksheet_sha != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.worksheet_repo }}
          ref: ${{ inputs.worksheet_sha }}
          path: worksheet

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Study-Hub registry
        working-directory: study-hub
        run: |
          npm ci
          npm run audit:platform-contracts

      - name: Verify Kani lock against Study-Hub checkout
        working-directory: kani
        env:
          KANI_CONTRACT_SOURCE_DIR: ${{ github.workspace }}/study-hub
        run: |
          npm ci
          npm run audit:contracts

      - name: Require Worksheet anti-drift check when supplied
        if: ${{ inputs.worksheet_repo != '' && inputs.worksheet_sha != '' }}
        working-directory: worksheet
        env:
          KANI_CONTRACT_SOURCE_DIR: ${{ github.workspace }}/study-hub
        run: |
          test -f package.json || { echo "Worksheet repo lacks package.json"; exit 1; }
          npm ci
          npm run audit:contracts

      - name: Write compatibility evidence
        shell: bash
        run: |
          cat > compatibility-result.json <<JSON
          {
            "studyHubSha": "${GITHUB_SHA}",
            "kaniSha": "${{ inputs.kani_sha }}",
            "worksheetRepo": "${{ inputs.worksheet_repo }}",
            "worksheetSha": "${{ inputs.worksheet_sha }}",
            "threeRepoRequired": ${{ inputs.require_three_repo }},
            "worksheetStatus": "${{ inputs.worksheet_repo != '' && 'resolved-and-tested' || 'unresolved-not-guessed' }}",
            "result": "pass"
          }
          JSON

      - name: Upload compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: platform-compatibility-${{ github.sha }}-${{ inputs.kani_sha }}
          path: compatibility-result.json
